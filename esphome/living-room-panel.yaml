# Living room - Room Panel (by the door, 1.4 m)
# Hardware + full firmware: https://github.com/gustavwrisberg/room-panel
#
# The firmware is pulled from the room-panel repo. The substitutions below point
# the knob, buttons and display at the entities and scripts this repo creates in
# home-assistant/packages/.
#
#   esphome run living-room-panel.yaml
# Then in Home Assistant: Settings > Devices & services > ESPHome > Living Room Panel >
# Configure > tick "Allow the device to perform Home Assistant actions".

substitutions:
  name: living-room-panel
  friendly_name: Living Room Panel
  light_entity: light.living_room                 # light group, packages/living_room_core.yaml
  blind_entity: cover.living_room_blinds          # motorised pleated blind
  scene_script: script.living_room_scene_next     # scene button, short press
  auto_script: script.living_room_auto            # scene button, long press: back to automatic
  away_script: script.living_room_all_off         # all-off button, short press
  night_script: script.living_room_night          # all-off button, long press: night mode
  price_entity: sensor.energi_data_service        # Energi Data Service (HACS) - CHECK the entity id

packages:
  room_panel: github://gustavwrisberg/room-panel/firmware/living-room-panel.yaml@main
