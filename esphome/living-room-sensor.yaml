# Living room - Room Sensor Lite (north-east corner, on the 45-degree corner mount)
# Hardware + full firmware: https://github.com/gustavwrisberg/room-sensor
#
# This file only names the device for this room; the firmware itself is pulled
# straight from the room-sensor repo, so fixes there land here on the next build.
#
#   esphome run living-room-sensor.yaml      (first time over USB-C, then OTA)

substitutions:
  name: living-room-sensor
  friendly_name: Living Room Sensor
  temp_offset: "0.0"        # calibrate against a reference thermometer for an hour

packages:
  room_sensor: github://gustavwrisberg/room-sensor/firmware/room-sensor-lite.yaml@main
