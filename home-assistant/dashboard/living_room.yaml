# Living room dashboard view.
# Settings > Dashboards > (your dashboard) > Edit > Raw configuration editor,
# then paste this under "views:".
- title: Living room
  path: living-room
  icon: mdi:sofa
  type: sections
  sections:
    - type: grid
      title: Room
      cards:
        - type: tile
          entity: binary_sensor.living_room_occupied
        - type: tile
          entity: sensor.living_room_panel_temperature
        - type: tile
          entity: sensor.living_room_panel_co2
        - type: tile
          entity: binary_sensor.living_room_window_open
    - type: grid
      title: Control
      cards:
        - type: tile
          entity: light.living_room
          features:
            - type: light-brightness
        - type: tile
          entity: cover.living_room_blinds
          features:
            - type: cover-open-close
        - type: tile
          entity: climate.living_room_radiator
          features:
            - type: target-temperature
        - type: tile
          entity: input_select.living_room_scene
    - type: grid
      title: Modes
      cards:
        - type: tile
          entity: input_boolean.living_room_auto
        - type: tile
          entity: input_boolean.night_mode
        - type: tile
          entity: vacuum.robot_vacuum
          features:
            - type: vacuum-commands
              commands: [start_pause, return_home]
        - type: tile
          entity: input_boolean.vacuum_when_room_empty
    - type: grid
      title: Settings
      cards:
        - type: entities
          entities:
            - input_datetime.morning_starts
            - input_datetime.night_starts
            - input_number.living_room_comfort_temp
            - input_number.living_room_eco_temp
            - input_number.living_room_night_temp
            - input_number.living_room_dark_lux
