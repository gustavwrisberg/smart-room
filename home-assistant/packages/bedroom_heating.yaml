# =====================================================================
#  Bedroom - heating
#  IKEA LILJEBAGGE radiator thermostat (Matter over Thread), wrapped by
#  Better Thermostat (HACS) so it regulates on the Room Panel's temperature
#  instead of the reading at the valve.
#
#  Target (sensor.bedroom_heating_target, see bedroom_core.yaml):
#    night mode                      -> night temperature   (17 °C)
#    occupied, or within 30 min      -> comfort temperature (20 °C)
#    empty for 30 min                -> eco temperature     (18 °C)
#    window open (temperature drop)  -> radiator off until it is closed (bedroom_windows.yaml)
#
#  In Better Thermostat leave "window sensor" empty - this package handles windows.
# =====================================================================

script:
  bedroom_apply_heating:
    alias: Bedroom - apply heating
    mode: restart
    sequence:
      - if:
          - condition: state
            entity_id: binary_sensor.bedroom_window_open
            state: "on"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.bedroom_radiator
            data:
              hvac_mode: "off"
        else:
          - action: climate.set_temperature
            target:
              entity_id: climate.bedroom_radiator
            data:
              hvac_mode: heat
              temperature: "{{ states('sensor.bedroom_heating_target') | float(19) }}"

automation:
  - id: bedroom_heating_follow_target
    alias: Bedroom heating - follow presence, night and window
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.bedroom_heating_target
      - trigger: state
        entity_id: binary_sensor.bedroom_window_open
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_auto
        state: "on"
    actions:
      - delay: "00:00:05"        # let presence settle before sending a Thread command
      - action: script.bedroom_apply_heating
