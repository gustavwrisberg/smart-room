# =====================================================================
#  Bedroom - lights
#  Presence + darkness turns the lights on, the scene decides how.
#  Day: neutral white. Evening: warm. Night mode: a dim night light only.
#  Someone in bed: automatic lighting pauses - the lights stay exactly as
#  they are (read, then switch off yourself) until you get up again.
#  Lights: two IKEA KAJPLATS bulbs (Matter over Thread) -> light.bedroom
# =====================================================================

script:
  bedroom_apply_lights:
    alias: Bedroom - apply lights
    mode: restart
    fields:
      force:
        description: Turn on even if the room is bright (used by the scene button)
        example: true
    sequence:
      - variables:
          scene: "{{ states('input_select.bedroom_scene') }}"
          evening: "{{ is_state('sun.sun', 'below_horizon') }}"
          kelvin: "{{ 2700 if evening else 4000 }}"
          # [ceiling %, bedside %, kelvin]; 0 = off
          looks:
            Everyday: [80, 60, 0]
            Reading: [0, 80, 3000]
            Cozy: [0, 40, 2200]
            Bright: [100, 100, 0]
          look: "{{ looks.get(scene, [80, 60, 0]) }}"
          k: "{{ look[2] if look[2] > 0 else kelvin }}"
      - choose:
          # nobody here -> off
          - conditions:
              - condition: state
                entity_id: binary_sensor.bedroom_occupied
                state: "off"
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.bedroom
                data:
                  transition: 5

          # night mode -> bedside lamp as a dim warm night light (getting up at night)
          - conditions:
              - condition: state
                entity_id: input_boolean.night_mode
                state: "on"
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.bedroom_ceiling
              - action: light.turn_on
                target:
                  entity_id: light.bedroom_bedside
                data:
                  brightness_pct: 5
                  color_temp_kelvin: 2200

          # dark enough (or the scene button was pressed) -> the scene
          - conditions:
              - condition: template
                value_template: >
                  {{ force | default(false) or is_state('binary_sensor.bedroom_dark', 'on')
                     or is_state('light.bedroom', 'on') }}
            sequence:
              - repeat:
                  for_each:
                    - entity: light.bedroom_ceiling
                      pct: "{{ look[0] }}"
                    - entity: light.bedroom_bedside
                      pct: "{{ look[1] }}"
                  sequence:
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.pct | int == 0 }}"
                      then:
                        - action: light.turn_off
                          target:
                            entity_id: "{{ repeat.item.entity }}"
                      else:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ repeat.item.entity }}"
                          data:
                            brightness_pct: "{{ repeat.item.pct | int }}"
                            color_temp_kelvin: "{{ k | int }}"
                            transition: 1

automation:
  - id: bedroom_lights_on_presence
    alias: Bedroom lights - someone comes in
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_occupied
        to: "on"
      - trigger: state
        entity_id: binary_sensor.bedroom_dark
        to: "on"
        for: "00:03:00"
      - trigger: state                       # got out of bed (e.g. at night -> night light)
        entity_id: binary_sensor.bedroom_in_bed
        from: "on"
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_auto
        state: "on"
      - condition: state
        entity_id: binary_sensor.bedroom_occupied
        state: "on"
      - condition: state
        entity_id: binary_sensor.bedroom_in_bed
        state: "off"
      - condition: state
        entity_id: timer.bedroom_lights_hold
        state: idle
      - condition: state
        entity_id: light.bedroom
        state: "off"
    actions:
      - action: script.bedroom_apply_lights

  - id: bedroom_lights_off_empty
    alias: Bedroom lights - off when empty
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_occupied
        to: "off"
        for: "00:05:00"
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_auto
        state: "on"
      - condition: state
        entity_id: binary_sensor.bedroom_in_bed
        state: "off"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.bedroom
        data:
          transition: 5

  - id: bedroom_lights_follow_sun
    alias: Bedroom lights - warm up at sunset
    triggers:
      - trigger: sun
        event: sunset
      - trigger: sun
        event: sunrise
    conditions:
      - condition: state
        entity_id: light.bedroom
        state: "on"
      - condition: state
        entity_id: input_boolean.bedroom_auto
        state: "on"
      - condition: state
        entity_id: binary_sensor.bedroom_in_bed
        state: "off"
    actions:
      - action: script.bedroom_apply_lights
