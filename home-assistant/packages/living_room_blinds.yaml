# =====================================================================
#  Living room - blinds
#  Open in the morning, close at dusk (privacy + keeps the heat in during
#  Danish winters), close for night mode, shade an empty room on hot days.
#  cover.living_room_blinds: IKEA HOPPVALS pleated blind with the motor board on
#  the Room Panel's J2 header, or any Matter/Thread blind motor.
# =====================================================================

script:
  living_room_apply_blinds:
    alias: Living room - apply blinds
    mode: restart
    sequence:
      - variables:
          after_morning: "{{ now().strftime('%H:%M:%S') >= states('input_datetime.morning_starts') }}"
          daylight: "{{ state_attr('sun.sun', 'elevation') | float(-90) > -4 }}"
          open: "{{ daylight and after_morning and is_state('input_boolean.night_mode', 'off') }}"
      - action: cover.set_cover_position
        target:
          entity_id: cover.living_room_blinds
        data:
          position: "{{ 100 if open else 0 }}"

automation:
  - id: living_room_blinds_follow_day
    alias: Living room blinds - morning and dusk
    triggers:
      - trigger: time
        at: input_datetime.morning_starts
      - trigger: numeric_state          # dusk / dawn (civil twilight-ish)
        entity_id: sun.sun
        attribute: elevation
        below: -4
      - trigger: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: -4
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.living_room_auto
        state: "on"
    actions:
      - action: script.living_room_apply_blinds

  - id: living_room_blinds_heat_protection
    alias: Living room blinds - shade an empty room on hot days
    triggers:
      - trigger: numeric_state
        entity_id: sensor.living_room_panel_temperature
        above: 24.5
        for: "00:15:00"
    conditions:
      - condition: state
        entity_id: input_boolean.living_room_auto
        state: "on"
      - condition: state
        entity_id: binary_sensor.living_room_occupied
        state: "off"
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: 15
    actions:
      - action: cover.set_cover_position
        target:
          entity_id: cover.living_room_blinds
        data:
          position: 30
