# =====================================================================
#  Living room - robot vacuum
#  Cleans once a day, only when nobody is around:
#    default: everyone has left home (zone.home = 0) for 10 minutes
#    optional: "Vacuum when the room is empty" - the living room has been
#              empty for 30 minutes, even if someone is elsewhere at home
#  Goes back to the dock as soon as someone comes home or presses a panel button.
#
#  vacuum.robot_vacuum: Roborock (core integration). Map the vacuum's rooms to
#  Home Assistant areas first: Settings > Entities > the vacuum > Map vacuum
#  segments to areas. Without the mapping use vacuum.start instead of clean_area.
# =====================================================================

input_boolean:
  living_room_vacuumed_today:
    name: Living room vacuumed today
    icon: mdi:robot-vacuum
  vacuum_when_room_empty:
    name: Vacuum when the room is empty (not only when away)
    icon: mdi:account-off
  vacuum_interrupted:
    name: Vacuum sent home early
    icon: mdi:home-import-outline

automation:
  - id: living_room_vacuum_start
    alias: Vacuum - clean the living room when nobody is around
    mode: single
    triggers:
      - trigger: state
        entity_id: zone.home
        to: "0"
        for: "00:10:00"
      - trigger: state
        entity_id: binary_sensor.living_room_occupied
        to: "off"
        for: "00:30:00"
      - trigger: time
        at: "10:00:00"
    conditions:
      - condition: state
        entity_id: input_boolean.living_room_vacuumed_today
        state: "off"
      - condition: state
        entity_id: input_boolean.night_mode
        state: "off"
      - condition: time
        after: "09:00:00"
        before: "20:00:00"
      - condition: state
        entity_id: vacuum.robot_vacuum
        state: docked
      - condition: or
        conditions:
          - condition: state
            entity_id: zone.home
            state: "0"
          - condition: and
            conditions:
              - condition: state
                entity_id: input_boolean.vacuum_when_room_empty
                state: "on"
              - condition: state
                entity_id: binary_sensor.living_room_occupied
                state: "off"
                for: "00:30:00"
    actions:
      - action: vacuum.clean_area
        target:
          entity_id: vacuum.robot_vacuum
        data:
          cleaning_area_id:
            - living_room
      - wait_for_trigger:
          - trigger: state
            entity_id: vacuum.robot_vacuum
            to: docked
            for: "00:01:00"
        timeout: "02:00:00"
        continue_on_timeout: false
      # only counts as done if it was not sent home early
      - if:
          - condition: template
            value_template: "{{ not is_state('input_boolean.vacuum_interrupted', 'on') }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.living_room_vacuumed_today
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuum_interrupted

  - id: living_room_vacuum_stop_someone_here
    alias: Vacuum - go home when someone is around
    triggers:
      - trigger: numeric_state          # someone comes home
        entity_id: zone.home
        above: 0
      - trigger: state                  # any Room Panel button
        entity_id:
          - binary_sensor.living_room_panel_button_lights
          - binary_sensor.living_room_panel_button_blinds
          - binary_sensor.living_room_panel_button_scene
          - binary_sensor.living_room_panel_button_all_off
        to: "on"
    conditions:
      - condition: state
        entity_id: vacuum.robot_vacuum
        state: cleaning
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.vacuum_interrupted
      - action: vacuum.return_to_base
        target:
          entity_id: vacuum.robot_vacuum

  - id: living_room_vacuum_reset_daily
    alias: Vacuum - new day
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.living_room_vacuumed_today
            - input_boolean.vacuum_interrupted
